<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Present Tense Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --accent-yellow: #facc15;
      --correct-color: #22c55e;
      --wrong-color: #ef4444;
      --bg-color: #f0fdf4;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: #e0f2fe;
      background-image: radial-gradient(#bae6fd 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 16px 32px rgba(14, 165, 233, 0.15);
      border: 4px solid #7dd3fc;
      width: 100%;
      max-width: 600px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #0284c7;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #0369a1;
      font-weight: 600;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .badge {
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 8px 16px;
      border-radius: 16px;
      border: 2px solid #bae6fd;
    }

    .timer-badge {
      background-color: #fef3c7;
      color: #b45309;
      padding: 8px 16px;
      border-radius: 16px;
      border: 2px solid #fde68a;
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background-color: #e2e8f0;
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      transition: width 0.1s linear;
      border-radius: 6px;
    }

    .question-card {
      background-color: #f8fafc;
      border: 3px dashed #93c5fd;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      text-align: center;
    }

    .question-text {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.6;
    }

    .blank {
      display: inline-block;
      min-width: 90px;
      border-bottom: 4px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0 8px;
      font-weight: 700;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 16px 12px;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #38bdf8;
      background-color: #f0f9ff;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #7dd3fc;
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd5e1;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-color);
      color: #ffffff;
      border-color: #16a34a;
      box-shadow: 0 4px 0 #15803d;
    }

    .option-btn.wrong {
      background-color: var(--wrong-color);
      color: #ffffff;
      border-color: #dc2626;
      box-shadow: 0 4px 0 #b91c1c;
    }

    /* Modal Styling */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: #ffffff;
      border-radius: 28px;
      border: 4px solid var(--accent-yellow);
      padding: 28px 20px;
      text-align: center;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .result-image-container {
      width: 100%;
      max-height: 220px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 3px solid #fde047;
    }

    .result-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-title {
      font-size: 1.8rem;
      color: #0284c7;
      margin-bottom: 6px;
    }

    .encouragement-text {
      font-size: 1.15rem;
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .modal-score {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .restart-btn {
      background-color: #f59e0b;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 14px 36px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 5px 0 #d97706;
      transition: all 0.15s ease;
    }

    .restart-btn:hover {
      background-color: #d97706;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #b45309;
    }

    .restart-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b45309;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>✨ Simple Present Tense ✨</h1>
      <p class="subtitle">Daily Challenge for Primary 2</p>
    </header>

    <div class="status-bar">
      <div class="badge" id="question-count">Question: 1 / 10</div>
      <div class="badge" id="score-display">Score: 0</div>
      <div class="timer-badge" id="timer-display">Time: 10s</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-card">
      <div class="question-text" id="question-text">Loading...</div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content">
        <div class="result-image-container">
          <img src="happy.jpg" alt="Great Job!" class="result-image">
        </div>
        <h2 class="modal-title" id="modal-title">Challenge Completed!</h2>
        <p class="encouragement-text" id="encouragement-text">You did fantastic today!</p>
        <p class="modal-score" id="final-score">Your Score: 10 / 10</p>
        <button class="restart-btn" onclick="restartGame()">Play Again 🚀</button>
      </div>
    </div>
  </div>

  <script>
    const questionsDatabase = [
      { sentence: ["Mum ", " to work on Mondays."], options: ["works", "work", "is working", "workes"], answer: 0 },
      { sentence: ["Peter ", " milk every morning."], options: ["drinks", "drink", "is drinking", "drinkes"], answer: 0 },
      { sentence: ["They ", " football every Sunday."], options: ["play", "plays", "are playing", "playes"], answer: 0 },
      { sentence: ["I ", " my teeth twice a day."], options: ["brush", "brushes", "am brushing", "brushs"], answer: 0 },
      { sentence: ["The sun ", " in the east."], options: ["rises", "rise", "is rising", "risese"], answer: 0 },
      { sentence: ["We ", " to school by bus every day."], options: ["go", "goes", "are going", "gos"], answer: 0 },
      { sentence: ["My cat ", " fish every afternoon."], options: ["eats", "eat", "is eating", "eates"], answer: 0 },
      { sentence: ["Mary ", " TV on Saturday nights."], options: ["watches", "watch", "is watching", "watchs"], answer: 0 },
      { sentence: ["The dogs ", " loudly at night."], options: ["bark", "barks", "are barking", "barkes"], answer: 0 },
      { sentence: ["Tim ", " his homework every day."], options: ["does", "do", "is doing", "doeses"], answer: 0 }
    ];

    const encouragingPhrases = {
      high: [
        "🌟 Outstanding effort! You are a Present Tense Superstar!",
        "🎉 Perfect score! Your grammar skills are amazing!",
        "🏆 Champion worker! Keep up the brilliant work!"
      ],
      medium: [
        "👍 Great job! You are getting stronger every day!",
        "😊 Well done! Keep practicing and you'll reach the top!",
        "⭐ Good effort! You are doing super well!"
      ],
      low: [
        "💪 Good try! Practice makes perfect every day!",
        "🎈 Don't give up! Try again and score higher next time!",
        "🌱 Great attempt! Every practice helps you learn!"
      ]
    };

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 10;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(isCorrect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      currentQuestions = JSON.parse(JSON.stringify(questionsDatabase));
      currentQuestions.forEach(q => {
        const correctAnswerText = q.options[q.answer];
        q.options = shuffleArray([...q.options]);
        q.answer = q.options.indexOf(correctAnswerText);
      });
      currentQuestions = shuffleArray(currentQuestions).slice(0, 10);
      currentQuestionIndex = 0;
      score = 0;
      
      document.getElementById('modal-overlay').classList.remove('active');
      updateScoreDisplay();
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timer);
      timeLeft = 10;
      updateTimerDisplay();

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('question-count').textContent = `Question: ${currentQuestionIndex + 1} / 10`;
      document.getElementById('question-text').innerHTML = `${q.sentence[0]}<span class="blank">____</span>${q.sentence[1]}`;

      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      q.options.forEach((optionText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optionText;
        btn.onclick = () => selectOption(index);
        optionsGrid.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      const progressBar = document.getElementById('progress-bar');
      progressBar.style.width = '100%';
      
      timer = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          clearInterval(timer);
          handleTimeout();
        }
        updateTimerDisplay();
        progressBar.style.width = `${(timeLeft / 10) * 100}%`;
      }, 100);
    }

    function updateTimerDisplay() {
      document.getElementById('timer-display').textContent = `Time: ${Math.ceil(timeLeft)}s`;
    }

    function updateScoreDisplay() {
      document.getElementById('score-display').textContent = `Score: ${score}`;
    }

    function selectOption(selectedIndex) {
      clearInterval(timer);
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        buttons[selectedIndex].classList.add('correct');
        playSound(true);
      } else {
        buttons[selectedIndex].classList.add('wrong');
        buttons[q.answer].classList.add('correct');
        playSound(false);
      }

      updateScoreDisplay();
      setTimeout(nextQuestion, 1200);
    }

    function handleTimeout() {
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);
      buttons[q.answer].classList.add('correct');
      playSound(false);

      setTimeout(nextQuestion, 1200);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showEndGameModal();
      }
    }

    function showEndGameModal() {
      let phrasesGroup = encouragingPhrases.low;
      if (score >= 8) {
        phrasesGroup = encouragingPhrases.high;
      } else if (score >= 5) {
        phrasesGroup = encouragingPhrases.medium;
      }

      const randomPhrase = phrasesGroup[Math.floor(Math.random() * phrasesGroup.length)];

      document.getElementById('encouragement-text').textContent = randomPhrase;
      document.getElementById('final-score').textContent = `Your Score: ${score} / 10`;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function restartGame() {
      initGame();
    }

    window.onload = initGame;
  </script>
</body>
</html>
