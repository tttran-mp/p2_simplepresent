<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Present Tense Challenge</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --correct-color: #22c55e;
      --wrong-color: #ef4444;
      --bg-color: #f0fdf4;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .badge {
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 6px 14px;
      border-radius: 12px;
    }

    .timer-badge {
      background-color: #fef3c7;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 12px;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: #e2e8f0;
      border-radius: 5px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: var(--primary-color);
      transition: width 0.1s linear;
    }

    .question-card {
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 3px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0 6px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background-color: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #eff6ff;
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-color);
      color: #ffffff;
      border-color: var(--correct-color);
    }

    .option-btn.wrong {
      background-color: var(--wrong-color);
      color: #ffffff;
      border-color: var(--wrong-color);
    }

    /* Modal Styling */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('happy.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 2rem;
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .modal-score {
      font-size: 1.5rem;
      font-weight: 700;
      color: #047857;
      margin-bottom: 24px;
    }

    .restart-btn {
      background-color: var(--primary-color);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 12px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background-color: var(--primary-hover);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>Simple Present Tense Challenge</h1>
      <p class="subtitle">Daily Grammar Practice for Primary 2</p>
    </header>

    <div class="status-bar">
      <div class="badge" id="question-count">Question: 1 / 10</div>
      <div class="badge" id="score-display">Score: 0</div>
      <div class="timer-badge" id="timer-display">Time: 10s</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-card">
      <div class="question-text" id="question-text">Loading question...</div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content">
        <h2 class="modal-title">Great Job!</h2>
        <p class="modal-score" id="final-score">Your Score: 10 / 10</p>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const questionsDatabase = [
      {
        sentence: ["Mum ", " to work on Mondays."],
        options: ["works", "work", "is working", "workes"],
        answer: 0
      },
      {
        sentence: ["Peter ", " milk every morning."],
        options: ["drinks", "drink", "is drinking", "drinkes"],
        answer: 0
      },
      {
        sentence: ["They ", " football every Sunday."],
        options: ["play", "plays", "are playing", "playes"],
        answer: 0
      },
      {
        sentence: ["I ", " my teeth twice a day."],
        options: ["brush", "brushes", "am brushing", "brushs"],
        answer: 0
      },
      {
        sentence: ["The sun ", " in the east."],
        options: ["rises", "rise", "is rising", "risese"],
        answer: 0
      },
      {
        sentence: ["We ", " to school by bus every day."],
        options: ["go", "goes", "are going", "gos"],
        answer: 0
      },
      {
        sentence: ["My cat ", " fish every afternoon."],
        options: ["eats", "eat", "is eating", "eates"],
        answer: 0
      },
      {
        sentence: ["Mary ", " TV on Saturday nights."],
        options: ["watches", "watch", "is watching", "watchs"],
        answer: 0
      },
      {
        sentence: ["The dogs ", " loudly at night."],
        options: ["bark", "barks", "are barking", "barkes"],
        answer: 0
      },
      {
        sentence: ["Tim ", " his homework every day."],
        options: ["does", "do", "is doing", "doeses"],
        answer: 0
      }
    ];

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 10;

    // Web Audio API for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(isCorrect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      currentQuestions = JSON.parse(JSON.stringify(questionsDatabase));
      currentQuestions.forEach(q => {
        const correctAnswerText = q.options[q.answer];
        q.options = shuffleArray([...q.options]);
        q.answer = q.options.indexOf(correctAnswerText);
      });
      currentQuestions = shuffleArray(currentQuestions).slice(0, 10);
      currentQuestionIndex = 0;
      score = 0;
      
      document.getElementById('modal-overlay').classList.remove('active');
      updateScoreDisplay();
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timer);
      timeLeft = 10;
      updateTimerDisplay();

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('question-count').textContent = `Question: ${currentQuestionIndex + 1} / 10`;
      document.getElementById('question-text').innerHTML = `${q.sentence[0]}<span class="blank">____</span>${q.sentence[1]}`;

      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      q.options.forEach((optionText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optionText;
        btn.onclick = () => selectOption(index);
        optionsGrid.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      const progressBar = document.getElementById('progress-bar');
      progressBar.style.width = '100%';
      
      timer = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          clearInterval(timer);
          handleTimeout();
        }
        updateTimerDisplay();
        progressBar.style.width = `${(timeLeft / 10) * 100}%`;
      }, 100);
    }

    function updateTimerDisplay() {
      document.getElementById('timer-display').textContent = `Time: ${Math.ceil(timeLeft)}s`;
    }

    function updateScoreDisplay() {
      document.getElementById('score-display').textContent = `Score: ${score}`;
    }

    function selectOption(selectedIndex) {
      clearInterval(timer);
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        buttons[selectedIndex].classList.add('correct');
        playSound(true);
      } else {
        buttons[selectedIndex].classList.add('wrong');
        buttons[q.answer].classList.add('correct');
        playSound(false);
      }

      updateScoreDisplay();
      setTimeout(nextQuestion, 1200);
    }

    function handleTimeout() {
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);
      buttons[q.answer].classList.add('correct');
      playSound(false);

      setTimeout(nextQuestion, 1200);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showEndGameModal();
      }
    }

    function showEndGameModal() {
      document.getElementById('final-score').textContent = `Your Score: ${score} / 10`;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function restartGame() {
      initGame();
    }

    window.onload = initGame;
  </script>
</body>
</html>
